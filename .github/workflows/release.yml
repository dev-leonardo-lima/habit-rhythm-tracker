name: Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Initialize once: current main commit SHA (leave empty to retry)'
        required: false
        type: string

permissions: {}

jobs:
  intake:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Record this push
        run: node scripts/release-cli.mjs capture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}

  reconcile:
    needs: intake
    if: >-
      always() &&
      (github.event_name != 'push' || needs.intake.result == 'success') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    concurrency:
      group: habit-rhythm-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Reconcile validated pushes
        run: node scripts/release-cli.mjs reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASELINE: ${{ inputs.baseline || '' }}

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate version
        run: npm run version:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test and coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Store validated release files
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Store coverage summary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release:
    needs: validate
    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    concurrency:
      group: habit-rhythm-tracker-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download validated release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-${{ github.sha }}
          path: release
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css
      - name: Publish release when the manifest version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./release/manifest.json').version")"
          echo "Manifest version: $version"
          assets=(main.js manifest.json styles.css)

          asset_names() {
            gh release view "$version" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          }

          has_asset() {
            asset_names | grep -qx "$1"
          }

          verify_assets() {
            local local_size remote_size
            for asset in "${assets[@]}"; do
              if ! has_asset "$asset"; then
                echo "::error::Release $version is missing $asset"
                exit 1
              fi
              local_size="$(stat -c%s "release/$asset")"
              remote_size="$(gh release view "$version" -R "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"$asset\") | .size")"
              if [[ "$remote_size" != "$local_size" ]]; then
                echo "::error::Asset $asset has size $remote_size; expected $local_size"
                exit 1
              fi
            done
          }

          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$version" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" == "false" ]]; then
              verify_assets
              echo "Release $version is already published; nothing to do."
              exit 0
            fi
            echo "Resuming draft release $version."
          else
            tag_sha="$(git ls-remote origin "refs/tags/$version^{}" | awk '{print $1}')"
            if [[ -z "$tag_sha" ]]; then
              tag_sha="$(git ls-remote origin "refs/tags/$version" | awk '{print $1}')"
            fi
            if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $version points to $tag_sha, not $GITHUB_SHA"
              exit 1
            fi

            latest="$(
              gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
                --json tagName --jq '.[].tagName' \
                | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
                | sort -V \
                | tail -n 1
            )"
            if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
              echo "::error::Version $version is not greater than the latest published version $latest"
              exit 1
            fi

            gh release create "$version" -R "$GITHUB_REPOSITORY" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$version" \
              --notes "Built from $GITHUB_SHA. Validation: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          for asset in "${assets[@]}"; do
            if ! has_asset "$asset"; then
              gh release upload "$version" "release/$asset" -R "$GITHUB_REPOSITORY"
            fi
          done

          verify_assets
          gh release edit "$version" -R "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published release $version."
